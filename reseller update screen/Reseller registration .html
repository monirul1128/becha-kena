<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reseller Registration</title>

<!-- Google Font: Inter -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<!-- FontAwesome Icons CDN -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
:root {
    --primary: #6366f1;
    --primary-dark: #4f46e5;
    --primary-light: #e0e7ff;
    --bg-color: #f1f5f9;
    --card-bg: #ffffff;
    --text-main: #0f172a;
    --text-muted: #64748b;
    --border-color: #cbd5e1;
    --success: #10b981;
    --danger: #ef4444;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Inter', sans-serif;
}

body{
    min-height:100vh;
    background: var(--bg-color);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
    -webkit-font-smoothing: antialiased;
}

/* =========================
   REGISTER CONTAINER
========================= */
.register-container{
    width:100%;
    max-width:440px;
}

/* =========================
   BRAND / HEADER
========================= */
.brand{
    text-align:center;
    margin-bottom:24px;
}

.brand-icon{
    width:64px;
    height:64px;
    margin:0 auto 12px;
    border-radius:20px;
    background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    box-shadow: 0 10px 20px -5px rgba(79, 70, 229, 0.4);
    font-size: 26px;
}

.brand h1{
    font-size:22px;
    color: var(--text-main);
    font-weight: 800;
    letter-spacing: -0.4px;
}

.brand p{
    margin-top:6px;
    font-size:13px;
    color: var(--text-muted);
    font-weight: 500;
}

/* =========================
   FORM CARD
========================= */
.register-card{
    background: var(--card-bg);
    border:1px solid var(--border-color);
    border-radius:22px;
    padding:28px;
    box-shadow:0 10px 30px -5px rgba(0,0,0,.06);
}

.form-title{
    font-size:17px;
    font-weight:700;
    margin-bottom:22px;
    color: var(--text-main);
    letter-spacing: -0.2px;
}

/* =========================
   FORM GROUP
========================= */
.form-group{
    margin-bottom:16px;
}

.form-group label{
    display:block;
    font-size:12px;
    font-weight:700;
    margin-bottom:8px;
    color: var(--text-main);
    text-transform: uppercase;
    letter-spacing: 0.3px;
}

.input-icon-wrapper{
    position: relative;
}

.input-icon-wrapper i.field-icon {
    position: absolute;
    left: 15px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--text-muted);
    font-size: 15px;
}

.form-group input{
    width:100%;
    height:48px;
    padding:0 15px 0 45px;
    border:1px solid var(--border-color);
    border-radius:12px;
    outline:none;
    font-size:14px;
    background:#fff;
    color: var(--text-main);
    transition: all 0.25s ease;
}

.form-group input:focus{
    border-color: var(--primary);
    box-shadow: 0 0 0 4px var(--primary-light);
}

/* =========================
   PASSWORD
========================= */
.password-wrapper input{
    padding-right:48px;
}

.toggle-password{
    position:absolute;
    right:14px;
    top:50%;
    transform:translateY(-50%);
    border:none;
    background:none;
    cursor:pointer;
    color: var(--text-muted);
    display: flex;
    align-items: center;
    justify-content: center;
    transition: color 0.2s;
    font-size: 15px;
}

.toggle-password:hover {
    color: var(--primary);
}

/* =========================
   TERMS
========================= */
.terms{
    display:flex;
    align-items:flex-start;
    gap:10px;
    margin:10px 0 20px;
    font-size:13px;
    color: var(--text-muted);
    line-height:1.4;
    font-weight: 500;
    cursor: pointer;
}

.terms input{
    margin-top:2px;
    width: 16px;
    height: 16px;
    accent-color: var(--primary);
    cursor: pointer;
}

/* =========================
   REGISTER BUTTON
========================= */
.register-btn{
    width:100%;
    height:48px;
    border:none;
    border-radius:12px;
    background: var(--primary);
    color:#fff;
    font-size:14px;
    font-weight:700;
    cursor:pointer;
    transition: all 0.25s ease;
    box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
}

.register-btn:hover{
    background: var(--primary-dark);
    transform: translateY(-1px);
    box-shadow: 0 6px 16px rgba(99, 102, 241, 0.4);
}

/* =========================
   LOGIN LINK
========================= */
.login-link{
    text-align:center;
    margin-top:20px;
    font-size:13px;
    color: var(--text-muted);
    font-weight: 500;
}

.login-link a{
    color: var(--primary);
    text-decoration:none;
    font-weight:700;
}

.login-link a:hover{
    text-decoration: underline;
}

/* =========================
   MESSAGE
========================= */
.message{
    display:none;
    margin-bottom:16px;
    padding:12px;
    border-radius:10px;
    font-size:13px;
    text-align:center;
    font-weight: 600;
}

.message.success{
    background:#dcfce7;
    color:#15803d;
}

.message.error{
    background:#fee2e2;
    color:#b91c1c;
}

/* =========================
   MOBILE RESPONSIVE
========================= */
@media(max-width:480px){
    body{
        padding:12px;
    }
    .register-card{
        padding:20px;
        border-radius:18px;
    }
    .brand h1{
        font-size:20px;
    }
}
</style>
</head>
<body>

<div class="register-container">

    <!-- BRAND -->
    <div class="brand">
        <div class="brand-icon">
            <i class="fa-solid fa-user-plus"></i>
        </div>
        <h1>Become a Reseller</h1>
        <p>Join our platform and start your business today</p>
    </div>

    <!-- REGISTER CARD -->
    <div class="register-card">
        <div class="form-title">
            Reseller Registration
        </div>

        <!-- Message Box -->
        <div id="message" class="message"></div>

        <form id="registerForm" onsubmit="registerUser(event)">

            <!-- Full Name -->
            <div class="form-group">
                <label>Full Name</label>
                <div class="input-icon-wrapper">
                    <i class="fa-solid fa-user field-icon"></i>
                    <input type="text" id="fullName" placeholder="Enter your full name" required>
                </div>
            </div>

            <!-- Mobile Number -->
            <div class="form-group">
                <label>Mobile Number</label>
                <div class="input-icon-wrapper">
                    <i class="fa-solid fa-phone field-icon"></i>
                    <input type="tel" id="mobile" placeholder="Enter your mobile number" inputmode="numeric" required>
                </div>
            </div>

            <!-- Email -->
            <div class="form-group">
                <label>Email Address <span style="font-weight:500;color:var(--text-muted); text-transform:none;">(Optional)</span></label>
                <div class="input-icon-wrapper">
                    <i class="fa-solid fa-envelope field-icon"></i>
                    <input type="email" id="email" placeholder="Enter your email address">
                </div>
            </div>

            <!-- Password -->
            <div class="form-group">
                <label>Password</label>
                <div class="input-icon-wrapper password-wrapper">
                    <i class="fa-solid fa-lock field-icon"></i>
                    <input type="password" id="password" placeholder="Create a password" minlength="6" required>
                    <button type="button" class="toggle-password" onclick="togglePassword('password')">
                        <i class="fa-solid fa-eye" id="eye-icon-password"></i>
                    </button>
                </div>
            </div>

            <!-- Confirm Password -->
            <div class="form-group">
                <label>Confirm Password</label>
                <div class="input-icon-wrapper password-wrapper">
                    <i class="fa-solid fa-lock field-icon"></i>
                    <input type="password" id="confirmPassword" placeholder="Confirm your password" minlength="6" required>
                    <button type="button" class="toggle-password" onclick="togglePassword('confirmPassword')">
                        <i class="fa-solid fa-eye" id="eye-icon-confirmPassword"></i>
                    </button>
                </div>
            </div>

            <!-- Terms -->
            <label class="terms">
                <input type="checkbox" id="terms" required>
                <span>I agree to the Terms & Conditions and Privacy Policy.</span>
            </label>

            <!-- Register Button -->
            <button type="submit" class="register-btn">
                Create Reseller Account
            </button>

        </form>

        <!-- Login Link -->
        <div class="login-link">
            Already have an account? <a href="login.html">Login</a>
        </div>

    </div>

</div>

<script>
/* =========================
   PASSWORD TOGGLE
========================= */
function togglePassword(id){
    const input = document.getElementById(id);
    const eyeIcon = document.getElementById("eye-icon-" + id);
    if(input.type === "password"){
        input.type = "text";
        eyeIcon.classList.remove("fa-eye");
        eyeIcon.classList.add("fa-eye-slash");
    }else{
        input.type = "password";
        eyeIcon.classList.remove("fa-eye-slash");
        eyeIcon.classList.add("fa-eye");
    }
}

/* =========================
   REGISTRATION LOGIC
========================= */
function registerUser(event){
    event.preventDefault();

    const name = document.getElementById("fullName").value.trim();
    const mobile = document.getElementById("mobile").value.trim();
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;
    const confirmPassword = document.getElementById("confirmPassword").value;
    const message = document.getElementById("message");

    /* Password Check */
    if(password !== confirmPassword){
        message.className = "message error";
        message.textContent = "Passwords do not match.";
        message.style.display = "block";
        return;
    }

    /* Demo Success */
    message.className = "message success";
    message.textContent = "Reseller account created successfully!";
    message.style.display = "block";

    document.getElementById("registerForm").reset();

    setTimeout(function(){
        window.location.href = "login.html";
    }, 1500);
}
</script>

</body>
</html>
